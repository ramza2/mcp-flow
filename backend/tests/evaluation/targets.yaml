# Configured KPI targets (docs/09 §25).
# Do not invent thresholds that are not already defined in canonical docs.
# `null` means no numeric pass/fail gate is configured for that KPI.
dataset_bundle_version: evaluation.v1

targets:
  KPI-01:
    # NFR-PERF segments are recorded; no approved numeric SLA in-repo yet.
    measured_value_unit: milliseconds
    target: null
    notes: Report segment timings only; do not invent latency SLAs.

  KPI-02:
    measured_value_unit: percent
    # Top-1 accuracy formula is canonical; numeric goal lives in approved project docs.
    target: null
    counting_rule: Correct Top-1 / Valid Evaluation Cases × 100
    dataset: tool-mapping/dataset.v1.json

  KPI-03:
    measured_value_unit: count
    # docs/09 §25 development floor (internal + external aggregate).
    target_min: 10
    target: null
    counting_rule: >
      Distinct MCPTool rows (deleted_at IS NULL) whose current_version_id has
      non-expired VERIFIED evidence (MCPToolVerificationRepository
      .count_tools_with_effective_current_verification).

  KPI-04:
    measured_value_unit: percent
    target: null
    counting_rule: Successful predefined registration cases / attempted cases × 100
    cases: registration/cases.yaml

  KPI-05:
    measured_value_unit: percent
    target: null
    counting_rule: Passed composite workflow scenarios / attempted scenarios × 100
    cases: workflow-scenarios/scenarios.yaml

  KPI-06:
    measured_value_unit: percent
    target: null
    counting_rule: Passed operations cases / attempted cases × 100
    cases: operation/cases.yaml
