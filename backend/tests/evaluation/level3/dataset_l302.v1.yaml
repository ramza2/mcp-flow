# L3-02 operator-review draft gold set. Freeze and review BEFORE official runs.
# Gold temporal values use explicit absolute 2026 dates to avoid run-date drift.
# Tool names are NOT expected output here: this evaluates natural-language
# intent/capability/entity/risk/time extraction by the production Analyzer contract.
schema_version: mcpflow.level3_analyzer_dataset.v1
dataset_version: level3-natural-language-analysis.v1
review_status: PENDING_REVIEW
cases:
  - id: W01
    request_text: "서울의 현재 날씨를 알려줘"
    family: weather_lookup
    expected_entities: {location: "서울"}
  - id: W02
    request_text: "부산 날씨 좀 조회해줘"
    family: weather_lookup
    expected_entities: {location: "부산"}
