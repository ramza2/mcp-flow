# Level 3 approval performance targets (separate from KPI-01..06 / targets.yaml).
# Official approved six indicators. L3-02 (pending gold review) and L3-05 evaluators are available.
# Thresholds are approval goals; NOT_IMPLEMENTED does not imply failure or achievement.
schema_version: mcpflow.level3_targets.v1
targets_version: level3.targets.v1

targets:
  L3-01:
    name: "MCP 서버 연동 성공률"
    status: NOT_IMPLEMENTED
    measured_value_unit: percent
    target_min_percent: 90.0
    notes: Measure actual MCP server connection attempts separately from discovery/registration.

  L3-02:
    name: "자연어 업무지시 분석 성공률"
    status: MEASURED_BY_TOOLING
    measured_value_unit: percent
    target_min_percent: 85.0
    dataset: dataset_l302.v1.yaml
    counting_rule: >
      Percentage of all 20 frozen cases whose real Analyzer-core
      StructuredRequest matches intent, business capability, risk,
      explicit entities and clarification. Errors count as failed cases,
      never removed from the denominator.
    notes: >
      Dataset gold set PENDING_REVIEW; explicit operator review acknowledgment
      required before official run. Does not measure Tool selection, runtime
      AgentRequest persistence transitions, or end-to-end execution.

  L3-03:
    name: "예약작업 정상 수행률"
    status: NOT_IMPLEMENTED
    measured_value_unit: percent
    target_min_percent: 90.0
    notes: Verify due schedule occurrences and actual Execution outcomes, not unit tests.

  L3-04:
    name: "복합 실행 시나리오 완료율"
    status: NOT_IMPLEMENTED
    measured_value_unit: percent
    target_min_percent: 85.0
    notes: Reuse validated scenario Execution evidence, not inferred unit test results.

  L3-05:
    name: "Tool 검색 평균 응답시간"
    status: MEASURED_BY_TOOLING
    measured_value_unit: seconds
    target_max_seconds: 3.0
    counting_rule: >
      Mean elapsed seconds of all required official retrieve() calls
      (fixed queries × official_repeats). Warm-up excluded. Any required
      failure → INCOMPLETE (no average from successes only).
    measurement_definition: >
      Wall time of ToolRetrievalService.retrieve() only: query embedding +
      authorized hybrid search. Excludes NL analysis, LLM rerank, and Tool
      execution.
    dataset: dataset.v2.yaml
    notes: Approval gate MET when complete average ≤ 3.0s; else NOT_MET.

  L3-06:
    name: "연계·검증 완료 MCP Tool 수"
    status: NOT_IMPLEMENTED
    measured_value_unit: count
    target_min_count: 10
    notes: Count unique connected and verified MCP Tools with reproducible evidence.
