# Level 3 approval performance targets (separate from KPI-01..06 / targets.yaml).
# Official approved six indicators. L3-01, L3-02 (pending gold review), L3-05, and L3-06 evaluators are available.
# Thresholds are approval goals; NOT_IMPLEMENTED does not imply failure or achievement.
schema_version: mcpflow.level3_targets.v1
targets_version: level3.targets.v1

targets:
  L3-01:
    name: "MCP 서버 연동 성공률"
    status: MEASURED_BY_TOOLING
    measured_value_unit: percent
    target_min_percent: 90.0
    counting_rule: >
      Fixed denominator = servers × attempts_per_server from the evaluation plan.
      Each attempt pins one mcp_server_checks.id inside the evaluation window.
      SUCCEEDED / FAILED / TIMED_OUT all remain in the denominator. Missing or
      ambiguous check_id matching → INCOMPLETE (never drop failures).
    measurement_definition: >
      SELECT-only reuse of durable mcp_server_checks rows. Does not run live
      Connection Test, Discovery, or external HTTP. PostgreSQL reads use
      REPEATABLE READ READ ONLY.
    plan: plan_l301.example.v1.yaml
    notes: >
      Entry: measure_l3_01.py / scripts/level3-mcp-connection-success.sh.
      Method: METHOD_L301.md. Example plan is 5×2 only; replace before --run.
      Artifacts under artifacts/level3/ (no overwrite).

  L3-02:
    name: "자연어 업무지시 분석 성공률"
    status: MEASURED_BY_TOOLING
    measured_value_unit: percent
    target_min_percent: 85.0
    dataset: dataset_l302.v1.yaml
    counting_rule: >
      Percentage of all 20 frozen cases whose real Analyzer-core
      StructuredRequest matches intent, business capability, risk,
      explicit entities and clarification. Errors count as failed cases,
      never removed from the denominator.
    notes: >
      Dataset gold set PENDING_REVIEW; explicit operator review acknowledgment
      required before official run. Does not measure Tool selection, runtime
      AgentRequest persistence transitions, or end-to-end execution.

  L3-03:
    name: "예약작업 정상 수행률"
    status: NOT_IMPLEMENTED
    measured_value_unit: percent
    target_min_percent: 90.0
    notes: Verify due schedule occurrences and actual Execution outcomes, not unit tests.

  L3-04:
    name: "복합 실행 시나리오 완료율"
    status: NOT_IMPLEMENTED
    measured_value_unit: percent
    target_min_percent: 85.0
    notes: Reuse validated scenario Execution evidence, not inferred unit test results.

  L3-05:
    name: "Tool 검색 평균 응답시간"
    status: MEASURED_BY_TOOLING
    measured_value_unit: seconds
    target_max_seconds: 3.0
    counting_rule: >
      Mean elapsed seconds of all required official retrieve() calls
      (fixed queries × official_repeats). Warm-up excluded. Any required
      failure → INCOMPLETE (no average from successes only).
    measurement_definition: >
      Wall time of ToolRetrievalService.retrieve() only: query embedding +
      authorized hybrid search. Excludes NL analysis, LLM rerank, and Tool
      execution.
    dataset: dataset.v2.yaml
    notes: Approval gate MET when complete average ≤ 3.0s; else NOT_MET.

  L3-06:
    name: "연계·검증 완료 MCP Tool 수"
    status: MEASURED_BY_TOOLING
    measured_value_unit: count
    target_min_count: 10
    counting_rule: >
      Distinct MCPTool rows (deleted_at IS NULL) whose current_version_id has
      non-expired VERIFIED evidence via
      MCPToolVerificationRepository.count_tools_with_effective_current_verification.
      Alias/clone suspicions are listed only (never auto-excluded); if unresolved
      suspicions change MET vs NOT_MET → INCOMPLETE. Does not require ACTIVE and
      does not perform live reconnect. Does not reuse KPI harness outputs.
    measurement_definition: >
      Repository SELECT inventory of effective VERIFIED current ToolVersions
      (linkage/verification already recorded by FNC-TOOL-006). Evidence includes
      Tool/Version/Verification/Server IDs and test/evidence references.
    notes: >
      Entry: measure_l3_06.py / scripts/level3-verified-tool-count.sh.
      Method: METHOD_L306.md. Artifacts under artifacts/level3/ (no overwrite).
