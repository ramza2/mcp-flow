# Level 3 L3-01 evaluation plan — EXAMPLE ONLY (5 servers × 2 attempts).
# Fix server_id / attempts_per_server / evaluation_window before official --run.
# Do NOT pre-pin check_id; --run collects every mcp_server_checks row in the window.
# Official runs require example: false.
schema_version: mcpflow.level3_l301_plan.v1
plan_version: level3-mcp-connection.v1
example: true
notes: >
  Fixed denominator = servers × attempts_per_server (set before tests).
  Collect all mcp_server_checks in the evaluation window per server.
  Exact attempts_per_server rows required; missing/excess/ambiguous → INCOMPLETE.
  SUCCEEDED / FAILED / TIMED_OUT all remain in the denominator.
  Preflight validates plan/servers/window without requiring checks yet.

evaluation_window:
  start: "2026-01-01T00:00:00Z"
  end: "2026-12-31T23:59:59Z"

attempts_per_server: 2

servers:
  - server_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1"
    label: "example-server-1"
  - server_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa2"
    label: "example-server-2"
  - server_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa3"
    label: "example-server-3"
  - server_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa4"
    label: "example-server-4"
  - server_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa5"
    label: "example-server-5"
