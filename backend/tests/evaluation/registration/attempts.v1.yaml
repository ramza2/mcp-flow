# Official KPI-04 attempt units (live_official evidence).
# Outcomes come from durable MCP check/discovery/tool/verification rows.
# Naked MCPFLOW_KPI_04_RESULT_* pass/fail flags are ignored.
attempts_version: registration-attempts.v2

# Required selectors:
#   TEST_DATABASE_URL or DATABASE_URL
#   MCPFLOW_KPI_SMOKE_MCP_SERVER_ID
# Optional evidence pins (else latest for smoke server is resolved):
#   MCPFLOW_KPI_SMOKE_CHECK_ID
#   MCPFLOW_KPI_SMOKE_DISCOVERY_ID
#   MCPFLOW_KPI_SMOKE_VERIFICATION_ID

attempts:
  - attempt_id: smoke-connect
    operation: connect
    title: Smoke MCP server connection check (mcp_server_checks)
    requires_env:
      - MCPFLOW_KPI_SMOKE_MCP_SERVER_ID

  - attempt_id: smoke-discovery
    operation: discovery
    title: Smoke MCP server discovery (mcp_server_discoveries)
    requires_env:
      - MCPFLOW_KPI_SMOKE_MCP_SERVER_ID

  - attempt_id: smoke-apply-register
    operation: apply/register
    title: Smoke registered tools on server (mcp_tools)
    requires_env:
      - MCPFLOW_KPI_SMOKE_MCP_SERVER_ID

  - attempt_id: smoke-verification
    operation: verification
    title: Smoke ToolVersion verification (mcp_tool_verifications)
    requires_env:
      - MCPFLOW_KPI_SMOKE_MCP_SERVER_ID
