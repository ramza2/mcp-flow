# Official KPI-04 attempt units (live_official evidence).
# Each attempt is one connect/discovery/apply/verification operation against a
# designated smoke resource. Never mutate arbitrary production resources.
attempts_version: registration-attempts.v1

# Required environment for live measurement (all must be set):
#   MCPFLOW_KPI_SMOKE_MCP_SERVER_ID  — designated smoke MCP server UUID
#   TEST_DATABASE_URL or DATABASE_URL

attempts:
  - attempt_id: smoke-connect
    operation: connect
    title: Smoke MCP server connection check
    requires_env:
      - MCPFLOW_KPI_SMOKE_MCP_SERVER_ID

  - attempt_id: smoke-discovery
    operation: discovery
    title: Smoke MCP server discovery
    requires_env:
      - MCPFLOW_KPI_SMOKE_MCP_SERVER_ID

  - attempt_id: smoke-apply-register
    operation: apply/register
    title: Smoke discovery apply / tool registration
    requires_env:
      - MCPFLOW_KPI_SMOKE_MCP_SERVER_ID

  - attempt_id: smoke-verification
    operation: verification
    title: Smoke ToolVersion verification evidence
    requires_env:
      - MCPFLOW_KPI_SMOKE_MCP_SERVER_ID
