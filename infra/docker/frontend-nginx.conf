server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — browser refresh on client routes must not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not cache the HTML shell aggressively.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
