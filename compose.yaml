name: mcpflow

# Base Compose — local/test/pilot should layer overrides (no Compose Profiles in this baseline).
# Canonical services in this PR: traefik, frontend, api, postgres, redis, object-storage, migration
# Deferred (no placeholder containers): worker, mcp-worker, factory-worker, scheduler, outbox

x-backend-build: &backend-build
  context: .
  dockerfile: infra/docker/backend.Dockerfile
  target: runtime
  args:
    PYTHON_IMAGE: python:3.12.10-slim-bookworm

x-frontend-build: &frontend-build
  context: .
  dockerfile: infra/docker/frontend.Dockerfile
  target: runtime
  args:
    NODE_IMAGE: node:22.14.0-bookworm-slim
    NGINX_IMAGE: nginxinc/nginx-unprivileged:1.27.4-alpine

services:
  traefik:
    image: traefik:v3.3.6
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${MCPFLOW_HTTP_PORT:-8080}:8080"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
    # Docker socket is intentionally NOT mounted (file provider only).
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  frontend:
    image: mcpflow-frontend:${MCPFLOW_IMAGE_TAG:-local}
    build: *frontend-build
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    image: mcpflow-backend:${MCPFLOW_IMAGE_TAG:-local}
    build: *backend-build
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      MCPFLOW_APP_NAME: MCPFlow API
      MCPFLOW_ENVIRONMENT: ${MCPFLOW_ENVIRONMENT:-development}
      MCPFLOW_DEBUG: ${MCPFLOW_DEBUG:-false}
      MCPFLOW_LOG_LEVEL: ${MCPFLOW_LOG_LEVEL:-INFO}
      MCPFLOW_DOCS_ENABLED: ${MCPFLOW_DOCS_ENABLED:-true}
      MCPFLOW_DB_HOST: postgres
      MCPFLOW_DB_PORT: "5432"
      MCPFLOW_DB_NAME: mcpflow
      MCPFLOW_DB_USER: mcpflow_app
      MCPFLOW_DB_PASSWORD_FILE: /run/secrets/postgres_app_password
      MCPFLOW_REDIS_URL: redis://redis:6379/0
      MCPFLOW_OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
    secrets:
      - postgres_app_password
    networks:
      - edge
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  migration:
    image: mcpflow-backend:${MCPFLOW_IMAGE_TAG:-local}
    build: *backend-build
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      MCPFLOW_ENVIRONMENT: ${MCPFLOW_ENVIRONMENT:-development}
      MCPFLOW_DB_HOST: postgres
      MCPFLOW_DB_PORT: "5432"
      MCPFLOW_DB_NAME: mcpflow
      MCPFLOW_DB_USER: mcpflow_migration
      MCPFLOW_DB_PASSWORD_FILE: /run/secrets/postgres_migration_password
    secrets:
      - postgres_migration_password
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mcpflow
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    secrets:
      - postgres_admin_password
      - postgres_migration_password
      - postgres_app_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init/001-bootstrap.sh:/docker-entrypoint-initdb.d/001-bootstrap.sh:ro
    command:
      - postgres
      - -c
      - timezone=UTC
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcpflow"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/minio-entrypoint.sh"]
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - object-storage-data:/data
      - ./infra/docker/minio-entrypoint.sh:/usr/local/bin/minio-entrypoint.sh:ro
    networks:
      - data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

networks:
  edge:
    name: mcpflow_edge
  app:
    name: mcpflow_app
  data:
    name: mcpflow_data
  mcp:
    name: mcpflow_mcp
  factory:
    name: mcpflow_factory

volumes:
  postgres-data:
    name: mcpflow_postgres-data
  redis-data:
    name: mcpflow_redis-data
  object-storage-data:
    name: mcpflow_object-storage-data

secrets:
  postgres_admin_password:
    file: ./infra/secrets/local/postgres_admin_password
  postgres_migration_password:
    file: ./infra/secrets/local/postgres_migration_password
  postgres_app_password:
    file: ./infra/secrets/local/postgres_app_password
  minio_root_user:
    file: ./infra/secrets/local/minio_root_user
  minio_root_password:
    file: ./infra/secrets/local/minio_root_password
