name: PR27 temporary validation

on:
  push:
    branches:
      - cursor/backend-execution-queue-claim-ba97

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mcpflow
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: mcpflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcpflow -d mcpflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mcpflow:test-password@127.0.0.1:5432/mcpflow_test
      MCPFLOW_DATABASE_URL: postgresql+asyncpg://mcpflow:test-password@127.0.0.1:5432/mcpflow_test
      MCPFLOW_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.lock
      - name: Runtime imports
        working-directory: backend
        run: python -c "import celery; import redis; print(celery.__version__, redis.__version__)"
      - name: Ruff
        id: ruff
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          ruff check . 2>&1 | tee ../ruff.log
      - name: Non-integration tests
        id: nonint
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          pytest -m "not integration" -q 2>&1 | tee ../pytest-non-integration.log
      - name: Integration tests
        id: integration
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          pytest -m integration -q 2>&1 | tee ../pytest-integration.log
      - name: Full tests
        id: full
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          pytest -m "" -q 2>&1 | tee ../pytest-full.log
      - name: Compose config
        id: compose
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker compose -f compose.yaml -f compose.local.yaml config 2>&1 | tee compose-config.log >/dev/null
      - name: Upload backend validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr27-backend-validation
          path: |
            ruff.log
            pytest-non-integration.log
            pytest-integration.log
            pytest-full.log
            compose-config.log
      - name: Enforce backend validation
        if: always()
        shell: bash
        run: |
          test "${{ steps.ruff.outcome }}" = success
          test "${{ steps.nonint.outcome }}" = success
          test "${{ steps.integration.outcome }}" = success
          test "${{ steps.full.outcome }}" = success
          test "${{ steps.compose.outcome }}" = success

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck / Vitest / build
        id: check
        continue-on-error: true
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee ../frontend-check.log
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        id: playwright
        continue-on-error: true
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright test 2>&1 | tee ../playwright.log
      - name: Upload frontend validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr27-frontend-validation
          path: |
            frontend-check.log
            playwright.log
      - name: Enforce frontend validation
        if: always()
        shell: bash
        run: |
          test "${{ steps.check.outcome }}" = success
          test "${{ steps.playwright.outcome }}" = success

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical docs
        run: python .github/pr27_patch_docs.py
      - name: Upload patched canonical docs
        uses: actions/upload-artifact@v4
        with:
          name: pr27-patched-docs
          path: |
            docs/02-functional-specification.md
            docs/03-system-architecture.md
            docs/05-data-model.md
            docs/08-deployment-architecture.md
            docs/09-test-strategy.md
