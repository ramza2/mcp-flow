name: PR27 temporary validation

on:
  push:
    branches:
      - cursor/backend-execution-queue-claim-ba97

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mcpflow
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: mcpflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcpflow -d mcpflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mcpflow:test-password@127.0.0.1:5432/mcpflow_test
      MCPFLOW_DATABASE_URL: postgresql+asyncpg://mcpflow:test-password@127.0.0.1:5432/mcpflow_test
      MCPFLOW_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.lock
      - name: Runtime imports
        working-directory: backend
        run: python -c "import celery; import redis; print(celery.__version__, redis.__version__)"
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: Non-integration tests
        working-directory: backend
        run: pytest -m "not integration" -q
      - name: Integration tests
        working-directory: backend
        run: pytest -m integration -q
      - name: Full tests
        working-directory: backend
        run: pytest -m "" -q
      - name: Compose config
        run: docker compose -f compose.yaml -f compose.local.yaml config >/dev/null

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck / Vitest / build
        working-directory: frontend
        run: pnpm check
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: pnpm exec playwright test
