# MCPFlow CI baseline — docs/09 §29 (selected PR gates).
# No production secrets; no Compose full stack; no external LLM/MCP calls.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_PG_USER: mcpflow
  CI_PG_PASSWORD: mcpflow_ci_ephemeral
  CI_PG_DB: mcpflow_test

jobs:
  backend:
    name: Backend (non-integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest (excludes integration via addopts)
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install and check
        run: |
          pnpm install --frozen-lockfile
          pnpm check

  postgres-integration:
    name: PostgreSQL integration / migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: mcpflow
          POSTGRES_PASSWORD: mcpflow_ci_ephemeral
          POSTGRES_DB: mcpflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcpflow -d mcpflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mcpflow:mcpflow_ci_ephemeral@localhost:5432/mcpflow_test
      MCPFLOW_DATABASE_URL: postgresql+asyncpg://mcpflow:mcpflow_ci_ephemeral@localhost:5432/mcpflow_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Alembic single head
        run: |
          heads="$(alembic heads)"
          echo "$heads"
          test "$(echo "$heads" | wc -l)" -eq 1

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Pytest integration
        run: pytest -m integration
