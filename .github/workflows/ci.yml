# MCPFlow CI — fail-closed changed-area routing with an always-on final gate.
# No production secrets, full Compose stack or external LLM/MCP calls.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_PG_USER: mcpflow
  CI_PG_PASSWORD: mcpflow_ci_ephemeral
  CI_PG_DB: mcpflow_test

jobs:
  changes:
    name: CI change impact
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.route.outputs.backend }}
      frontend: ${{ steps.route.outputs.frontend }}
      postgres: ${{ steps.route.outputs.postgres }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          # PR synthetic merge and push before SHA must both be available.
          fetch-depth: 0
      - name: Validate impact classifier offline
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Select required jobs (fail closed)
        id: route
        run: python3 scripts/ci/impact.py

  backend:
    name: Backend (non-integration)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend (dev)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest (excludes integration via addopts)
        run: pytest

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install and check
        run: |
          pnpm install --frozen-lockfile
          pnpm check

  postgres-integration:
    name: PostgreSQL integration / migrations
    needs: changes
    if: ${{ needs.changes.outputs.postgres == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: mcpflow
          POSTGRES_PASSWORD: mcpflow_ci_ephemeral
          POSTGRES_DB: mcpflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcpflow -d mcpflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mcpflow:mcpflow_ci_ephemeral@localhost:5432/mcpflow_test
      MCPFLOW_DATABASE_URL: postgresql+asyncpg://mcpflow:mcpflow_ci_ephemeral@localhost:5432/mcpflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install redis-server (dedicated broker E2E only)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq redis-server
          # Do not start the distro redis service — the E2E suite spawns its own
          # throwaway redis-server on a free loopback port and stops it on teardown.
      - name: Install backend (dev)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Alembic single head
        run: |
          heads="$(alembic heads)"
          echo "$heads"
          test "$(echo "$heads" | wc -l)" -eq 1
      - name: Alembic upgrade head
        run: alembic upgrade head
      - name: Pytest integration
        run: pytest -m integration

  gate:
    name: CI quality gate
    needs: [changes, backend, frontend, postgres-integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      IMPACT_RESULT: ${{ needs.changes.result }}
      NEED_BACKEND: ${{ needs.changes.outputs.backend }}
      NEED_FRONTEND: ${{ needs.changes.outputs.frontend }}
      NEED_POSTGRES: ${{ needs.changes.outputs.postgres }}
      GOT_BACKEND: ${{ needs.backend.result }}
      GOT_FRONTEND: ${{ needs.frontend.result }}
      GOT_POSTGRES: ${{ needs.postgres-integration.result }}
    steps:
      - name: Verify every required job actually passed
        run: |
          python3 - <<'PY'
          import os
          import sys
          impact = os.getenv("IMPACT_RESULT")
          checks = (
              ("backend", os.getenv("NEED_BACKEND"), os.getenv("GOT_BACKEND")),
              ("frontend", os.getenv("NEED_FRONTEND"), os.getenv("GOT_FRONTEND")),
              ("postgres", os.getenv("NEED_POSTGRES"), os.getenv("GOT_POSTGRES")),
          )
          good = impact == "success"
          for name, required, actual in checks:
              expected = "success" if required == "true" else "skipped"
              passed = required in {"true", "false"} and actual == expected
              good = good and passed
              print(f"{name}: required={required}, actual={actual}, expected={expected}")
          if not good:
              print("CI_QUALITY_GATE_FAIL: required test failed, skipped, or impact unknown")
              sys.exit(1)
          print("CI_QUALITY_GATE_PASS")
          PY
